name: 환율 데이터 갱신

on:
  schedule:
    - cron: "0 0,9 * * *"   # UTC 00:00, 09:00 = 한국시간 09:00, 18:00
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]         # 코드를 고쳐 올리면 바로 재배포

permissions:
  contents: write   # rates.json 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한국은행 ECOS 환율 받기
        if: github.event_name != 'push'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python fetch_rates.py

      - name: 바뀐 데이터 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "환율 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
